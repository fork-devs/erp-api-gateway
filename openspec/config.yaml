schema: spec-driven

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
context: |
  # Idioma
  Todos los artefactos (proposal, specs, design, tasks) se redactan en español.

  # Qué es este repositorio
  Este repositorio contiene el servicio de puerta de entrada (API Gateway) del backend SaaS B2B multi-tenant para
  talleres automotrices en Perú ("DriveOS Workshop"), que se despliega en el
  puerto 8080. Forma parte de un conjunto de microservicios independientes,
  cada uno en su propio repositorio git, con su propia base de datos y su propio
  ciclo de despliegue. Edge: JWT/JWKS, rate-limit por tenant y plan, mamparo por taller, proxy inverso a los servicios internos.

  Las especificaciones de `openspec/specs/` describen el CONTRATO de las
  capacidades del sistema, que en varios casos abarcan más de un microservicio.
  Este repositorio guarda la copia de los changes que le afectan, de modo que
  quien trabaje aquí tenga el contrato completo a su alcance.

  # Arquitectura obligatoria (4 capas,Ports & Adapters)
  Cada microservicio Java sigue esta estructura, y los cambios no deben romperla:
    domain/          modelo de dominio, Value Objects, puertos de salida, eventos.
                     PROHIBIDO cualquier import de Spring, Jakarta Persistence,
                     Jackson, Lombok o cualquier framework. Cero anotaciones.
    application/     casos de uso y servicios de orquestación. Dependen SOLO de
                     `domain/port`. PROHIBIDO importar `infrastructure`.
    infrastructure/  adaptadores: persistencia JPA, clientes HTTP externos, cache,
                     seguridad, messaging, schedulers. Único lugar con framework.
    interfaces/      controladores REST, DTOs request/response, manejo de errores.
  Reglasderivadas de esa estructura:
    - La lógica de negocio no vive en los controladores ni en los adapters.
    - La demarcación transaccional se declara en la capa de aplicación, nunca
      en los adapters de persistencia. Los adapters se unen a la transacción
      abierta; no abren la suya.
    - Los servicios de aplicación se instancian como beans gestionados por Spring
      (nunca con `new` en una clase `@Configuration`), para que el proxy AOP
      funcione (`@Transactional`, `@PreAuthorize`, `@Retryable`, `@CircuitBreaker`).
    - Los casos de uso se exponen como interfaces en `application/usecase`; los
      controladores dependen de esas interfaces, nunca de un puerto de `domain`
      ni de un repositorio.
    - El mapeo entre entidad JPA y modelo de dominio va en
      `infrastructure/persistence/mapper/`, no dentro del adapter.

  # Multi-inquilino
  - `tenant_id` es obligatorio en toda entidad de negocio y en toda fila de tabla
    salvo catálogos globales explícitos (`plans`, `roles`).
  - El tenant se deriva EXCLUSIVAMENTE del token JWT verificado. Nunca de una
    cabecera del cliente (`X-Tenant-ID` es una pista, no una autoridad) ni de un
    campo del cuerpo de la petición. Si un request trae `tenant_id` en el body,
    se ignora o se rechaza.
  - Aislamiento en base de datos: PostgreSQL con Row-Level Security. La política
    RLS es `USING (tenant_id = current_setting('app.tenant_id')::uuid)`. Requiere
    `FORCE ROW LEVEL SECURITY` y que la aplicación conecte con un rol que NO sea
    el propietario de las tablas, porque el owner bypasea RLS.
  - `app.tenant_id` se establece con `SET LOCAL` dentro de la transacción activa.
    Si no hay transacción, el aislamiento no está garantizado: fallar cerrado.

  # Seguridad
  - MFA es obligatorio en el diseño de autenticación (columna `mfa_enabled` ya
    existe pero el segundo factor aún no).
  - Los access tokens llevan `jti` para poder revocarse; el logout debe invalidar
    el access token, no solo el refresh token.
  - Los refresh tokens rotan de un solo uso, con detección de reutilización y
    revocación de la familia de tokens.
  - MFA y roles: el claim de roles del JWT es `roles` (array). Ningún servicio
    puede leer un claim `role` en singular.
  - Se exige HTTPS (TLS) para el JWKS y para todo destino interno o externo.
    `http://` solo en desarrollo local.
  - Ningún secreto (contraseñas, API keys, claves privadas) se escribe en el
    código, en `application.yml` versionado ni en `.env.example`. Se resuelven
    por variable de entorno o `vault:`.

  # Integraciones externas
  - El `erp-integration-hub` es el ÚNICO punto de salida a SUNAT/PSE, RENIEC,
    Stripe y consulta vehicular. Ningún otro servicio los llama directamente.
  - Toda llamada externa pasa por un puerto de dominio con un adapter por
    proveedor, y traduce el modelo externo a un modelo interno propio.
  - El modo sandbox de un proveedor debe ser un adapter mock activable por perfil
    de entorno, no una rama `if` dentro del adapter de producción. Con sandbox
    activo en un perfil no-dev, el arranque debe fallar de forma ruidosa.
  - Idempotencia: la clave de idempotencia se reclama ANTES de llamar al
    proveedor y debe poder actualizarse después (upsert por clave de negocio).
    Un fallo transitorio del proveedor no se cachea como respuesta definitiva.

  # Eventos
  - Todo cambio de estado relevante se persiste junto a su evento en la misma
    transacción local (Transactional Outbox) y lo publica un relay a Kafka.
    Nunca se publica un evento dentro de la transacción que lo origina.
  - Los consumidores son idempotentes y deduplican por el identificador del
    evento, que viaja en el payload y en una columna propia.

  # Persistencia
  - Flyway es el dueño del esquema. `ddl-auto: validate` en producción.
  - `baseline-on-migrate: false`: el servicio es dueño de su esquema.
  - Las migraciones se ejecutan también en los tests, contra PostgreSQL real
    (Testcontainers). Los tests en H2 con `create-drop` no detectan deriva entre
    entidad y migración.
  - Cada migración es reversible en su intención y no rompe en caliente.

  # Testing
  - Pirámide: unitarias de dominio puras (sin Spring) + integración con
    Testcontainers + contrato de API/evento + E2E de los caminos críticos.
  - Todo cambio de comportamiento lleva su test. Una task de implementación
    incluye la verificación de su propio test.
  - Existe una suite de pruebas cross-tenant obligatoria para cualquier cambio
    que toque aislamiento, autenticación o propagación de `tenant_id`.
  - Cobertura mínima del 80% en la capa `domain/`, medida con JaCoCo.

  # Convenciones de API
  - REST versionado en la ruta (`/api/v1/...`). Errores con `ProblemDetail`
    (RFC 9457) y un código de error estable por familia, legible por máquina.
  - `tenant_id` viaja en los errores para que el frontend pueda mostrarlos sin
    adivinar.
  - OpenAPI se genera y se versiona; los contratos compartidos viven en un
    paquete común, no se duplican servicio a servicio.

  # Documentación
  - `docs/` es la fuente de verdad de la arquitectura y del estado de
    implementación (ADD, ASRs QA-1..QA-9, 14 patrones de diseño). OpenSpec
    describe LOS CAMBIOS; `docs/` describe EL SISTEMA. No deben contradecirse:
    si un change altera una decisión de arquitectura, se actualiza también el
    documento de `docs/` correspondiente en la misma entrega.

  # Fuera de alcance de este repositorio (no se proponen changes para esto)
  Los 7 microservicios no construidos (`core-service`, `erp-fleet-service`,
  `erp-inventory-service`, `operations-service`, `billing-service`, ingesta IoT
  en Go, procesador IoT/analítica en Python) se proponen en batches posteriores.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
rules:
  proposal:
    - Cada item de "What Changes" referencia el hallazgo del reporte de estado
      (`docs/doc-estado-implementacion.md`) que lo origina, con su identificador
      (P0 5.x, P1 6.x) para que la trazabilidad sea verificable.
    - Marcar explícitamente los cambios que rompen compatibilidad con
      **BREAKING** (por ejemplo, cambiar el nombre de un claim JWT o de una
      cabecera).
  specs:
    - Cada requisito SHALL/MUST debe ser verificable por un test automatizado
      concreto; si no lo es, pertenece a design.md y no a la spec.
    - Los escenarios que cubren un hallazgo de seguridad deben nombrar
      explícitamente al actor y al tenant atacante, no a un "usuario genérico".
  design:
    - Cada decisión debe citar la alternativa descartada y el motivo, en línea
      con la convención de ADR del proyecto.
    - Cuando la decisión dependa de una elección entre microservicios (por
      ejemplo, qué servicio posee la máquina de estados de un comprobante),
      la decisión debe quedar explícita y además quedar registrada como
      pregunta abierta si aún no está tomada por el equipo.
  tasks:
    - Cada task debe nombrar el fichero o la clase affected para que sea
      localizable sin volver a explorar el repositorio.
    - Las tasks que cierran un P0 deben incluir la task de test de regresión
      que lo demuestra, o declarar explícitamente por qué el P0 ya queda
      cubierto por un test existente.

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
operations:
  apply:
    guidance:
      - Cuando una task toque la demarcación transaccional, verificar al terminar
        que la operación sigue siendo atómica (commit único) y que un fallo
        intermedio no deja estado parcial observable.
      - Al tocar el esquema, ejecutar las migraciones de Flyway contra
        PostgreSQL real y no solo contra H2.
      - No aceptar una task como completada si su verificación no se ejecutó y
        se comprobó su resultado.
  archive:
    guidance:
      - Al archivar, resumir qué hallazgos del reporte de estado quedaron
        cerrados y cuáles se trasladaron a changes posteriores.

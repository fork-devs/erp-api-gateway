server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: erp-api-gateway

erp:
  gateway:
    # La URL del conjunto de claves debe usar un esquema cifrado. El arranque
    # falla de forma explicita si no lo hace, y la unica excepcion es el
    # perfil de desarrollo local (application-dev.yml).
    jwks-url: ${JWKS_URL:https://auth.erp-automotriz.com/.well-known/jwks.json}
    tenant-service-url: ${TENANT_SERVICE_URL:http://localhost:8082}
    default-timeout-ms: ${DEFAULT_TIMEOUT_MS:10000}
    routes:
      auth-service:
        path-prefix: /api/v1/auth
        target-url: ${AUTH_SERVICE_URL:http://localhost:8081}
        requires-auth: false
        timeout-ms: 10000
      users-service:
        path-prefix: /api/v1/users
        target-url: ${AUTH_SERVICE_URL:http://localhost:8081}
        requires-auth: true
        timeout-ms: 10000
      tenant-service:
        path-prefix: /api/v1/tenants
        target-url: ${TENANT_SERVICE_URL:http://localhost:8082}
        requires-auth: true
        timeout-ms: 10000
      plans-service:
        path-prefix: /api/v1/plans
        target-url: ${TENANT_SERVICE_URL:http://localhost:8082}
        requires-auth: false
        timeout-ms: 10000
      fleet-service:
        path-prefix: /api/v1/fleet
        target-url: ${FLEET_SERVICE_URL:http://localhost:8083}
        requires-auth: true
        timeout-ms: 10000
      work-order-service:
        path-prefix: /api/v1/work-orders
        target-url: ${WORK_ORDER_SERVICE_URL:http://localhost:8084}
        requires-auth: true
        timeout-ms: 10000
      inventory-service:
        path-prefix: /api/v1/inventory
        target-url: ${INVENTORY_SERVICE_URL:http://localhost:8085}
        requires-auth: true
        timeout-ms: 10000
      billing-service:
        path-prefix: /api/v1/billing
        target-url: ${BILLING_SERVICE_URL:http://localhost:8086}
        requires-auth: true
        timeout-ms: 10000
      telemetry-service:
        path-prefix: /api/v1/telemetry
        target-url: ${TELEMETRY_SERVICE_URL:http://localhost:8087}
        requires-auth: true
        timeout-ms: 10000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    root: INFO
    com.erp.apigateway: DEBUG

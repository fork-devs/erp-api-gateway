server:
  port: 8080

spring:
  profiles:
    active: dev
  application:
    name: erp-api-gateway-test

erp:
  gateway:
    # El perfil de test es de desarrollo local: es el unico en el que la URL
    # del conjunto de claves puede ir en claro.
    jwks-url: http://localhost:8081/.well-known/jwks.json
    tenant-service-url: http://localhost:8082
    default-timeout-ms: 5000
    routes:
      auth-service:
        path-prefix: /api/v1/auth
        target-url: ${AUTH_SERVICE_URL:http://localhost:8081}
        requires-auth: false
        # Ruta de ARRANQUE: en el login, el refresco y el
        # restablecimiento de contrasena el cliente declara el taller como
        # filtro. Viaja como una PISTA, que el destino contrasta con el token.
        tenant-filter-allowed: true
        timeout-ms: 10000
      users-service:
        path-prefix: /api/v1/users
        target-url: ${AUTH_SERVICE_URL:http://localhost:8081}
        requires-auth: true
        timeout-ms: 10000
      tenant-service:
        path-prefix: /api/v1/tenants
        target-url: ${TENANT_SERVICE_URL:http://localhost:8082}
        requires-auth: true
        timeout-ms: 10000
      plans-service:
        path-prefix: /api/v1/plans
        target-url: ${TENANT_SERVICE_URL:http://localhost:8082}
        requires-auth: false
        timeout-ms: 10000
      fleet-service:
        path-prefix: /api/v1/fleet
        target-url: ${FLEET_SERVICE_URL:http://localhost:8083}
        requires-auth: true
        # El plazo que fija el spec para las comunicaciones internas.
        timeout-ms: 500
      work-order-service:
        path-prefix: /api/v1/work-orders
        # Puerto libre: el 8084 es el del servicio de inventario. El servicio
        # de ordenes de trabajo todavia no existe.
        target-url: ${WORK_ORDER_SERVICE_URL:http://localhost:8088}
        requires-auth: true
        # El plazo que fija el spec para las comunicaciones internas.
        timeout-ms: 500
      inventory-service:
        path-prefix: /api/v1/inventory
        # El servicio de inventario escucha en el 8084: la ruta apuntaba al
        # 8085, que es el puerto del hub de integraciones, de modo que
        # /api/v1/inventory no alcanzaba al inventario.
        target-url: ${INVENTORY_SERVICE_URL:http://localhost:8084}
        requires-auth: true
        # El plazo que fija el spec para las comunicaciones internas.
        timeout-ms: 500
      billing-service:
        path-prefix: /api/v1/billing
        target-url: ${BILLING_SERVICE_URL:http://localhost:8086}
        requires-auth: true
        timeout-ms: 10000
      telemetry-service:
        path-prefix: /api/v1/telemetry
        target-url: ${TELEMETRY_SERVICE_URL:http://localhost:8087}
        requires-auth: true
        timeout-ms: 10000

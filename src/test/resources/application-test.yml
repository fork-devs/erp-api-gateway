# Configuracion de los TESTS DE CONTRATO del borde.
#
# Esta NO sustituye a src/main/resources/application.yml: se carga COMO
# perfil, de modo que la tabla de rutas sigue teniendo UNA sola fuente de
# verdad, la de produccion. Duplicarla en los tests era una segunda
# definicion que podia divergir sin que nadie lo notase (el mismo peligro
# que el hallazgo 6.34).
#
# El perfil de desarrollo local sigue activo porque es el unico en el que la
# URL del conjunto de claves puede ir en claro: en los tests el emisor de
# identidades se sirve en la propia maquina.

spring:
  application:
    name: erp-api-gateway-test
  jpa:
    show-sql: false
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,gatewayDependencies
        liveness:
          include: livenessState
  health:
    db:
      enabled: false
    readiness:
      state:
        enabled: true
    liveness:
      state:
        enabled: true

_format_version: "3.0"

# =============================================================================
# KONG GATEWAY DECLARATIVE CONFIGURATION (DB-LESS) — DRIVEOS WORKSHOP
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # 1. IAM & AUTHENTICATION SERVICE (Puerto 8081)
  # ---------------------------------------------------------------------------
  - name: erp-auth-service
    url: http://erp-auth-service:8081
    connect_timeout: 5000
    read_timeout: 10000
    write_timeout: 10000
    routes:
      - name: auth-public-routes
        paths:
          - /api/v1/auth/login
          - /api/v1/auth/refresh
          - /api/v1/auth/forgot-password
          - /api/v1/auth/reset-password
          - /.well-known/jwks.json
        strip_path: false
      - name: auth-protected-routes
        paths:
          - /api/v1/auth/logout
          - /api/v1/users
        strip_path: false
        plugins:
          - name: openid-connect
            config:
              issuer: http://erp-auth-service:8081
              discovery: http://erp-auth-service:8081/.well-known/openid-configuration
              jwks_uri: http://erp-auth-service:8081/.well-known/jwks.json
              bearer_only: "yes"

  # ---------------------------------------------------------------------------
  # 2. TENANT MANAGEMENT SERVICE (Puerto 8082)

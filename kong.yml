_format_version: "3.0"

# =============================================================================
# KONG GATEWAY DECLARATIVE CONFIGURATION (DB-LESS) — DRIVEOS WORKSHOP
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # 1. IAM & AUTHENTICATION SERVICE (Puerto 8081)
  # ---------------------------------------------------------------------------
  - name: erp-auth-service
    url: http://erp-auth-service:8081
    connect_timeout: 5000
    read_timeout: 10000
    write_timeout: 10000
    routes:
      - name: auth-public-routes
        paths:
          - /api/v1/auth/login
          - /api/v1/auth/refresh
          - /api/v1/auth/forgot-password
          - /api/v1/auth/reset-password
          - /api/v1/authentication
          - /.well-known/jwks.json
        strip_path: false
      - name: auth-protected-routes
        paths:
          - /api/v1/auth/logout
          - /api/v1/users
        strip_path: false
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              claims_to_verify:
                - exp

  # ---------------------------------------------------------------------------
  # 2. TENANT MANAGEMENT SERVICE (Puerto 8082)
  # ---------------------------------------------------------------------------
  - name: erp-tenant-service
    url: http://erp-tenant-service:8082
    connect_timeout: 5000
    read_timeout: 10000
    write_timeout: 10000
    routes:
      - name: tenant-plans-public-route
        paths:
          - /api/v1/plans
        strip_path: false
      - name: tenant-protected-routes
        paths:
          - /api/v1/tenants
          - /api/v1/workshops
          - /api/v1/branches
          - /api/v1/employees
          - /api/v1/owners
          - /api/v1/profiles
          - /api/v1/permissions
          - /api/v1/admin/outbox
        strip_path: false
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              claims_to_verify:
                - exp

  # ---------------------------------------------------------------------------
  # 3. FLEET SERVICE (Clientes y Vehiculos - Puerto 8083)
  # ---------------------------------------------------------------------------
  - name: erp-fleet-service
    url: http://erp-fleet-service:8083
    connect_timeout: 5000
    read_timeout: 10000
    write_timeout: 10000
    routes:
      - name: fleet-routes
        paths:
          - /api/v1/customers
          - /api/v1/vehicles
          - /api/v1/appointments
          - /api/v1/customer-registrations
          - /api/v1/employee-registrations
        strip_path: false
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              claims_to_verify:
                - exp

  # ---------------------------------------------------------------------------
  # 4. INVENTORY SERVICE (Repuestos y Stock FIFO - Puerto 8084)
  # ---------------------------------------------------------------------------
  - name: erp-inventory-service
    url: http://erp-inventory-service:8084
    connect_timeout: 5000
    read_timeout: 10000
    write_timeout: 10000
    routes:
      - name: inventory-routes
        paths:
          - /api/v1/inventory
        strip_path: false
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              claims_to_verify:
                - exp

  # ---------------------------------------------------------------------------
  # 5. INTEGRATION HUB (SUNAT, Stripe, RENIEC - Puerto 8085)
  # ---------------------------------------------------------------------------
  - name: erp-integration-hub
    url: http://erp-integration-hub:8085
    connect_timeout: 5000
    read_timeout: 15000
    write_timeout: 15000
    routes:
      - name: integration-webhooks-routes
        paths:
          - /api/v1/integrations/webhooks/stripe
          - /api/v1/integrations/webhooks/nubefact
          - /api/v1/integrations/webhooks/mercadopago
        strip_path: false
      - name: integration-protected-routes
        paths:
          - /api/v1/integrations
          - /api/v1/identity-validations
          - /api/v1/media
        strip_path: false
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              claims_to_verify:
                - exp

  # ---------------------------------------------------------------------------
  # 6. WORK ORDER SERVICE (Ordenes de Trabajo y Sagas - Puerto 8088)
  # ---------------------------------------------------------------------------
  - name: erp-work-order-service
    url: http://erp-work-order-service:8087
    connect_timeout: 5000
    read_timeout: 15000
    write_timeout: 15000
    routes:
      - name: work-order-routes
        paths:
          - /api/v1/work-orders
          - /api/v1/work-order-tasks
          - /api/v1/services
        strip_path: false
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              claims_to_verify:
                - exp

  # ---------------------------------------------------------------------------
  # 7. BILLING SERVICE (Facturacion y Pagos - Puerto 8086)
  # ---------------------------------------------------------------------------
  - name: erp-billing-service
    url: http://erp-billing-service:8086
    connect_timeout: 5000
    read_timeout: 15000
    write_timeout: 15000
    routes:
      - name: billing-routes
        paths:
          - /api/v1/billing
          - /api/v1/quotes
          - /api/v1/checkouts
          - /api/v1/vouchers
          - /api/v1/payments
        strip_path: false
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              claims_to_verify:
                - exp

  # ---------------------------------------------------------------------------
  # 8. IOT INGESTION SERVICE (Telemetria Vehicular - Puerto 8087)
  # ---------------------------------------------------------------------------
  - name: erp-iot-ingestion
    url: http://erp-iot-ingestion:8089
    connect_timeout: 3000
    read_timeout: 5000
    write_timeout: 5000
    routes:
      - name: iot-ingestion-routes
        paths:
          - /api/v1/iot/telemetry
          - /api/v1/obd2-devices
          - /api/v1/obd2-device-registrations
          - /api/v1/telemetry-batches
        strip_path: false
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              claims_to_verify:
                - exp

  # ---------------------------------------------------------------------------
  # 9. IOT PROCESSOR SERVICE (Diagnosticos y Alarmas Vehiculares - Puerto 8088)
  # ---------------------------------------------------------------------------
  - name: erp-iot-processor
    url: http://erp-iot-processor:8088
    connect_timeout: 3000
    read_timeout: 5000
    write_timeout: 5000
    routes:
      - name: iot-processor-routes
        paths:
          - /api/v1/iot/diagnostics
          - ~/api/v1/vehicles/[^/]+/(telemetry-snapshots|dtc-alerts)
          - ~/api/v1/obd2-device-registrations/[^/]+/(telemetry-snapshots|dtc-alerts)
        strip_path: false
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              claims_to_verify:
                - exp

  # ---------------------------------------------------------------------------
  # 10. ANALYTICS SERVICE (Reportes y Métricas Operativas OLAP - Puerto 8090)
  # ---------------------------------------------------------------------------
  - name: erp-analytics-service
    url: http://erp-analytics-service:8090
    connect_timeout: 3000
    read_timeout: 5000
    write_timeout: 5000
    routes:
      - name: analytics-routes
        paths:
          - /api/v1/analytics
        strip_path: false
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              claims_to_verify:
                - exp

# =============================================================================
# PLUGINS GLOBALES
# =============================================================================
  # ---------------------------------------------------------------------------
  # 11. IOT TRAFFIC SIMULATOR (Puerto 8089)
  # ---------------------------------------------------------------------------
  - name: erp-iot-simulator
    url: http://erp-iot-simulator:8089
    connect_timeout: 5000
    read_timeout: 10000
    write_timeout: 10000
    routes:
      - name: iot-simulator-routes
        paths:
          - /api/v1/simulator
        strip_path: false
        plugins:
          - name: jwt
            config:
              key_claim_name: iss
              claims_to_verify:
                - exp

plugins:
  # 1. Habilitar CORS para clientes Web y Mobile
  - name: cors
    config:
      origins:
        - ${CORS_ALLOWED_ORIGIN:https://app.driveos.pe}
        - http://localhost:3000
        - http://localhost:5173
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Authorization
        - Content-Type
        - X-Requested-With
      exposed_headers:
        - Content-Length
        - X-Request-ID
      credentials: true
      max_age: 3600

  # 2. Seguridad Multi-tenant: Sanitizar cabecera externa X-Tenant-ID
  - name: request-transformer
    config:
      remove:
        headers:
          - x-tenant-id
          - X-Tenant-ID
          - X-TENANT-ID

  # 3. Rate Limiting distribuido respaldado por Redis (env-driven para Azure Cache for Redis)
  - name: rate-limiting
    config:
      minute: 120
      hour: 3600
      policy: ${RATE_LIMIT_POLICY:redis}
      redis_host: ${REDIS_HOST:redis}
      redis_port: ${REDIS_PORT:6379}
      redis_password: ${REDIS_PASSWORD}
      redis_ssl: ${REDIS_SSL:false}
      redis_ssl_verify: ${REDIS_SSL_VERIFY:false}
      redis_database: ${REDIS_DATABASE:0}
      fault_tolerant: true
      hide_client_headers: false

consumers:
  - username: driveos-platform
    jwt_secrets:
      - key: "${JWT_ISSUER:erp-auth-service}"
        algorithm: RS256
        rsa_public_key: |
          ${JWT_PUBLIC_KEY}

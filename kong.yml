      - name: tenant-plans-public-route
        paths:
          - /api/v1/plans
        strip_path: false
      - name: tenant-protected-routes
        paths:
          - /api/v1/tenants
          - /api/v1/admin/outbox
        strip_path: false
        plugins:
          - name: openid-connect
            config:
              issuer: http://erp-auth-service:8081
              discovery: http://erp-auth-service:8081/.well-known/openid-configuration
              jwks_uri: http://erp-auth-service:8081/.well-known/jwks.json

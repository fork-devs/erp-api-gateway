# =============================================================================
# PLUGINS GLOBALES
# =============================================================================
plugins:
  # 1. Habilitar CORS para clientes Web y Mobile
  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Authorization
        - Content-Type
        - X-Requested-With
      exposed_headers:
        - Content-Length
        - X-Request-ID
      credentials: true
      max_age: 3600

  # 2. Seguridad Multi-tenant: Sanitizar cabecera externa X-Tenant-ID
  - name: request-transformer
    config:
      remove:
        headers:
          - x-tenant-id
          - X-Tenant-ID
          - X-TENANT-ID

  # 3. Rate Limiting distribuido respaldado por Redis
  - name: rate-limiting
    config:
      minute: 120
      hour: 3600
      policy: redis
      redis_host: ${REDIS_HOST:redis}
      redis_port: ${REDIS_PORT:6379}
      redis_password: ${REDIS_PASSWORD}
      fault_tolerant: true
      hide_client_headers: false
